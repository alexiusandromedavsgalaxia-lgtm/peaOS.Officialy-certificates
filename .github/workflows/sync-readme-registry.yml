name: Sync certificate registry mirrors

on:
  push:
    paths:
      - registry.json
      - .github/workflows/sync-readme-registry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate authoritative registry
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('registry.json', 'utf8'));
          if (registry.issuer !== 'peaOS.Officialy-certificates') throw new Error('registry issuer mismatch');
          if (registry.schema !== 1) throw new Error('unsupported registry schema');
          if (registry.peaOS_certificate_version !== 3) throw new Error('certificate version mismatch');
          if (registry.certificate_type !== 'SigningCertificate') throw new Error('certificate type mismatch');
          if (registry.authentication !== 'R35-SHA512') throw new Error('authentication protocol mismatch');
          if (!Array.isArray(registry.certificates)) throw new Error('registry.certificates must be an array');
          for (const cert of registry.certificates) {
            if (!cert || typeof cert.id !== 'string' || !/^[0-9a-f]{32}$/.test(cert.id)) throw new Error('certificate id must be 32 lowercase hex characters');
            if (cert.type !== 'SigningCertificate') throw new Error(`certificate ${cert.id} type mismatch`);
            if (typeof cert.status !== 'string' || !cert.status) throw new Error(`certificate ${cert.id} without status`);
            if (typeof cert.sha512 !== 'string' || !/^[0-9a-f]{128}$/.test(cert.sha512)) throw new Error(`certificate ${cert.id} has invalid SHA-512`);
          }
          console.log(`authoritative registry: ${registry.certificates.length} certificate(s)`);
          NODE

      - name: Mirror authoritative registry to web
        run: cp registry.json web/registry.json

      - name: Generate README registry section
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path("registry.json").read_text(encoding="utf-8"))
          certs = registry.get("certificates", [])

          active = sum(1 for c in certs if c.get("status") == "active")
          revoked = sum(1 for c in certs if c.get("status") == "revoked")
          expired = sum(1 for c in certs if c.get("status") == "expired")
          invalid = sum(1 for c in certs if c.get("status") == "invalid")
          unavailable = sum(1 for c in certs if c.get("status") == "server-unavailable")

          lines = [
              "## Estado actual",
              "",
              f"**Certificados conocidos: {len(certs)}**",
              "",
              "| Campo | Estado |",
              "|---|---:|",
              f"| Certificados conocidos | {len(certs)} |",
              f"| Activos | {active} |",
              f"| Revocados | {revoked} |",
              f"| Expirados | {expired} |",
              f"| Inválidos | {invalid} |",
              f"| Servidor no disponible | {unavailable} |",
              "| Distribución local | 0 |",
              "| Web Distribution | 0 |",
              "| Aplicaciones registradas | 0 |",
              "| Sitios web registrados | 0 |",
              "",
              "## Registro de certificados",
              "",
          ]

          if certs:
              lines += [
                  "| ID | Estado | Serie | Emisión | Expiración | SHA-512 |",
                  "|---|---|---|---|---|---|",
              ]
              for c in certs:
                  lines.append(
                      f"| `{c.get('id','')}` | {c.get('status','')} | `{c.get('serial','')}` | "
                      f"{c.get('issued_at','')} | {c.get('expires_at','')} | `{c.get('sha512','')}` |"
                  )
          else:
              lines.append("_No hay certificados registrados._")

          new_section = "\n".join(lines)
          readme = Path("README.md").read_text(encoding="utf-8")
          start = "<!-- REGISTRY:START -->"
          end = "<!-- REGISTRY:END -->"
          a = readme.index(start) + len(start)
          b = readme.index(end)
          readme = readme[:a] + "\n" + new_section + "\n" + readme[b:]
          Path("README.md").write_text(readme, encoding="utf-8")
          PY

      - name: Verify mirrors are byte-identical
        run: cmp -s registry.json web/registry.json

      - name: Commit synchronized mirrors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/registry.json README.md
          if git diff --cached --quiet; then
            echo "All registry mirrors already synchronized"
            exit 0
          fi
          git commit -m "chore: sync registry mirrors"
          git push
